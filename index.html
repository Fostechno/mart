<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Header</title>
<style>
:root{
  color-scheme:light; --bg:#ffffff; --surface:#f3f5f7; --text:#14213d; --muted:#5b6575;
  --accent:#1f6feb; --accent-text:#ffffff; --border:#dde2e8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1200px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:24px;
}
.logo{
  display:flex; align-items:center; gap:10px;
  text-decoration:none; color:var(--text); font-weight:700; font-size:1.25rem; flex-shrink:0;
}
.logo-mark{
  width:36px; height:36px; border-radius:10px; background:var(--accent);
  color:var(--accent-text); display:grid; place-items:center; font-weight:700;
}
.search{
  flex:1; max-width:520px; margin:0 auto; position:relative; display:flex;
}
.search input{
  width:100%; padding:11px 16px 11px 44px; border:1px solid var(--border);
  border-radius:999px; background:var(--surface); color:var(--text); font:inherit; font-size:.95rem;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:2px solid var(--accent); outline-offset:1px; background:var(--bg)}
.search svg{position:absolute; left:15px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2}
.nav{display:flex; gap:6px; flex-shrink:0}
.nav a{
  text-decoration:none; color:var(--text); font-weight:500; font-size:.95rem;
  padding:9px 14px; border-radius:8px;
}
.nav a:hover{background:var(--surface)}
.nav a:focus-visible{outline:2px solid var(--accent)}
.nav a.cta{background:var(--accent); color:var(--accent-text)}
.nav a.cta:hover{opacity:.9}

@media (max-width:820px){
  .header-inner{flex-wrap:wrap; gap:12px; padding:12px 16px}
  .logo{order:1}
  .nav{order:2; margin-left:auto; gap:2px}
  .nav a{padding:8px 10px; font-size:.88rem}
  .search{order:3; flex-basis:100%; max-width:none}
}
@media (max-width:420px){
  .logo span.name{display:none}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo" aria-label="Home">
      <div class="logo-mark">L</div>
      <span class="name">MeraLogo</span>
    </a>

    <form class="search" role="search" onsubmit="return false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" placeholder="Products search karein..." aria-label="Search">
    </form>

    <nav class="nav" aria-label="Main">
      <a href="#products">Products</a>
      <a href="#about">About Us</a>
      <a href="#contact" class="cta">Contact Us</a>
    </nav>
  </div>
</header>
</body>
</html>
